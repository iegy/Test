name: Build Tajweed Al-Fatiha Native v2

on:
  push:
    branches:
      - codex/tajweed-fatiha-v2-native-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install public-domain Minshawi Al-Fatiha reference
        working-directory: tajweed-fatiha-v1.0.2
        run: |
          mkdir -p app/src/main/assets dist
          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/b/b9/Sura_Minshawi_1.ogg' \
            --output app/src/main/assets/fatiha-reference-cc0.ogg
          test "$(stat -c%s app/src/main/assets/fatiha-reference-cc0.ogg)" -gt 800000

      - name: Run Python reference regressions
        working-directory: tajweed-fatiha-v1.0.2
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y \
            -i app/src/main/assets/fatiha-reference-cc0.ogg \
            -ar 16000 -ac 1 -c:a pcm_s16le dist/minshawi_reference_16k.wav
          python3 python/reference_pipeline.py dist/minshawi_reference_16k.wav --self-test --json > dist/V2_REGRESSION_RESULT.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('dist/V2_REGRESSION_RESULT.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['ayah_count'] == 7, r
          assert r['silence_rejected'] is True, r
          assert r['all_self_reference_madd_pass'] is True, r
          assert r['all_truncations_detected'] is True, r
          assert all(x['reference']['accepted'] for x in r['ayat']), r
          assert all(x['tempo_0_80x_accepted'] for x in r['ayat']), r
          assert all(x['tempo_1_25x_accepted'] for x in r['ayat']), r
          lines = [
              '# V2.0.1 CI Regression Summary', '',
              '- Ayah segmentation: **7/7**',
              '- Silence rejected: **yes**',
              '- Trusted-reference madd self-check: **pass**',
              '- Severe truncation detected for every ayah: **pass**',
              '- 0.80x and 1.25x tempo variants accepted for every ayah: **pass**', '',
              '| Ayah | Range (ms) | Speech (ms) | SNR dB | Cut ratio |',
              '|---:|---:|---:|---:|---:|',
          ]
          for x in r['ayat']:
              lines.append(f"| {x['ayah']} | {x['range_ms'][0]}–{x['range_ms'][1]} | {x['reference']['speech_ms']} | {x['reference']['snr_db']} | {x['truncated_speech_ratio']} |")
          lines += ['', '## Scope note', '', 'These are deterministic engineering regressions. They do not establish scholarly accuracy for subtle makhraj/sifat judgments on real learners.']
          Path('dist/V2_REGRESSION_CI_REPORT.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('REGRESSION_GATE_PASS')
          PY
          rm -f dist/minshawi_reference_16k.wav

      - name: Build native debug APK
        working-directory: tajweed-fatiha-v1.0.2
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK launcher, assets and signature
        working-directory: tajweed-fatiha-v1.0.2
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          zipinfo -1 "$APK" | grep -F 'assets/fatiha-reference-cc0.ogg'
          FOUND=0
          while read -r DEX; do
            echo "Checking $DEX"
            if unzip -p "$APK" "$DEX" | strings | grep -F 'com/iegy/tajweed/fatiha/MainActivity'; then FOUND=1; fi
          done < <(zipinfo -1 "$APK" | grep -E '^classes[0-9]*\.dex$')
          test "$FOUND" -eq 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" dist/Tajweed_AlFatiha_v2.0.1_native_installable.apk
          sha256sum dist/Tajweed_AlFatiha_v2.0.1_native_installable.apk > dist/SHA256SUMS.txt
          {
            echo 'Architecture: Native Android/Kotlin'
            echo 'Version: 2.0.1'
            echo 'WebView dependency: removed from v2 launcher path'
            echo 'Bundled reference: Muhammad Siddiq Al-Minshawi Al-Fatiha, Wikimedia Commons public-domain file'
            echo 'Reference segmentation: taawwudh excluded; seven ayat mapped automatically'
            echo 'Microphone: AudioRecord native PCM/WAV'
            echo 'File import: Android document picker + MediaCodec decode'
            echo 'Playback: AudioTrack native PCM'
            echo 'Analysis: known-text acoustic alignment + VAD + reference-calibrated timing/madd + confidence'
            echo 'Regression gate: passed before APK build'
            echo 'Launcher class: verified in DEX'
            echo 'Bundled reference asset: verified in APK'
            echo 'APK signature: verified by apksigner'
            echo "APK bytes: $(stat -c%s dist/Tajweed_AlFatiha_v2.0.1_native_installable.apk)"
          } > dist/CI_VERIFICATION_V2.txt
          cp reports/V2_REGRESSION_REPORT.md dist/V2_REGRESSION_REPORT.md
          cp reports/MODEL_DATASET_AUDIO_LICENSE_REPORT.md dist/MODEL_DATASET_AUDIO_LICENSE_REPORT.md
          cp reports/P0_DECISION_MATRIX.md dist/P0_DECISION_MATRIX.md
          cp PROJECT_STATE.md dist/PROJECT_STATE.md

      - name: Package source
        working-directory: tajweed-fatiha-v1.0.2
        run: zip -qr dist/QuranTajweedNative_Source_v2.0.1.zip . -x '.gradle/*' 'app/build/*' 'dist/*'

      - uses: actions/upload-artifact@v4
        with:
          name: Tajweed-AlFatiha-Native-v2.0.1-FINAL
          path: tajweed-fatiha-v1.0.2/dist/*
          if-no-files-found: error
          retention-days: 14
