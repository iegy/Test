name: Tariqi Android Build

on:
  push:
    branches:
      - codex/tariqi-android-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reconstruct Tariqi v1.1 base source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tariqi-src /tmp/tariqi-source.zip /tmp/tariqi-v12-overlay.zip
          mkdir -p /tmp/tariqi-src
          cat .ci/v11x.part-00 .ci/v11fix01s-00 .ci/v11fix01s-01 .ci/v11fix01s-02 .ci/v11fix01s-03 .ci/v11fix01s-04 .ci/v11x.part-02 .ci/v11x.part-03 .ci/v11x.part-04 .ci/v11x.part-05 | base64 -d > /tmp/tariqi-source.zip
          echo "c1464512d31b0022ef0f500270d98da2eea27f03b1ae1e0f481d0557a1bdbe9d  /tmp/tariqi-source.zip" | sha256sum -c -
          unzip -tq /tmp/tariqi-source.zip
          unzip -q /tmp/tariqi-source.zip -d /tmp/tariqi-src
          if [ -d /tmp/tariqi-src/tariqi-android ]; then
            echo "PROJECT_DIR=/tmp/tariqi-src/tariqi-android" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=/tmp/tariqi-src" >> "$GITHUB_ENV"
          fi

      - name: Apply verified Tariqi v1.2 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/v12fix00-00 .ci/v12fix00-01 .ci/v12fix00-02 .ci/v12fix00-03 .ci/v12fix00-04 .ci/v12fix00-05 .ci/v12-overlay.part-01 .ci/v12-overlay.part-02 .ci/v12-overlay.part-03 .ci/v12-overlay.part-04 .ci/v12fix05-00 .ci/v12fix05-01 .ci/v12fix05-02 .ci/v12fix05-03 .ci/v12fix05-04 .ci/v12fix05-05 .ci/v12-overlay.part-06 .ci/v12-overlay.part-07 .ci/v12-overlay.part-08 | base64 -d > /tmp/tariqi-v12-overlay.zip
          echo "654e95a987bc59ee25bb85befc51439c72bc05c5414e6d457efdc59fa12a45f6  /tmp/tariqi-v12-overlay.zip" | sha256sum -c -
          unzip -tq /tmp/tariqi-v12-overlay.zip
          unzip -oq /tmp/tariqi-v12-overlay.zip -d "$PROJECT_DIR"
          grep -F 'versionName = "1.2.0"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -F 'versionCode = 3' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Install final Tariqi launcher logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable-nodpi"
          base64 -d .ci/tariqi-logo-final.png.b64 > "$PROJECT_DIR/app/src/main/res/drawable-nodpi/tariqi_logo.png"
          echo "a6c8a95e2efd6c51c3acf0e2483c64fb3e278d0ba3bd3357efec5037a869af0e  $PROJECT_DIR/app/src/main/res/drawable-nodpi/tariqi_logo.png" | sha256sum -c -
          cat > "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/tariqi_logo" />
          </adaptive-icon>
          EOF

      - name: Fetch and validate full Tajweed Quran data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          curl -L --fail --retry 4 --retry-delay 2 \
            -o "$PROJECT_DIR/app/src/main/assets/quran-tajweed.json" \
            "https://api.alquran.cloud/v1/quran/quran-tajweed"
          python3 - <<'PY'
          import json, os
          p = os.environ["PROJECT_DIR"] + "/app/src/main/assets/quran-tajweed.json"
          with open(p, "r", encoding="utf-8") as f:
              root = json.load(f)
          if root.get("code") != 200:
              raise SystemExit(f"AlQuran Cloud returned code={root.get('code')}")
          surahs = root.get("data", {}).get("surahs", [])
          ayahs = sum(len(s.get("ayahs", [])) for s in surahs)
          if len(surahs) != 114 or ayahs != 6236:
              raise SystemExit(f"Unexpected Quran dataset: surahs={len(surahs)} ayahs={ayahs}")
          print(f"Validated quran-tajweed: surahs={len(surahs)} ayahs={ayahs}")
          PY
          sha256sum "$PROJECT_DIR/app/src/main/assets/quran-tajweed.json"

      - name: Upload reconstructed v1.2 source diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: tariqi-v1.2-reconstructed-source
          path: ${{ env.PROJECT_DIR }}
          retention-days: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download sherpa-onnx Android runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/app/libs"
          curl -L --fail --retry 4 --retry-delay 2 \
            -o "$PROJECT_DIR/app/libs/sherpa-onnx-1.13.2.aar" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-1.13.2.aar"
          echo "aa5505c0ec4f8bdaee5f214a64ba3012be64f2aecc022e82a64f33392b8dd245  $PROJECT_DIR/app/libs/sherpa-onnx-1.13.2.aar" | sha256sum -c -

      - name: Compile Tariqi v1.2 debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare v1.2 build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tariqi-output/build-tools/lib
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" /tmp/tariqi-output/Tariqi-v1.2-base-debug.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/tariqi-output/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" /tmp/tariqi-output/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" /tmp/tariqi-output/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/tariqi-output/build-tools/lib/
          cp -r "$PROJECT_DIR" /tmp/tariqi-output/source
          sha256sum /tmp/tariqi-output/Tariqi-v1.2-base-debug.apk > /tmp/tariqi-output/BASE_APK_SHA256.txt

      - name: Upload Tariqi v1.2 build kit
        uses: actions/upload-artifact@v4
        with:
          name: tariqi-v1.2-android-build-kit
          path: /tmp/tariqi-output
          retention-days: 14
