name: Tariqi Android Build

on:
  push:
    branches:
      - codex/tariqi-android-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reconstruct Tariqi source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tariqi-src /tmp/tariqi-source.zip
          mkdir -p /tmp/tariqi-src
          cat .ci/src2.part-* | base64 -d > /tmp/tariqi-source.zip
          echo "070047fb7a7c526001cc76e0a5fc3f1ef3834d2d596be296c63290cb892afa6b  /tmp/tariqi-source.zip" | sha256sum -c -
          unzip -tq /tmp/tariqi-source.zip
          unzip -q /tmp/tariqi-source.zip -d /tmp/tariqi-src
          if [ -d /tmp/tariqi-src/tariqi-android ]; then
            echo "PROJECT_DIR=/tmp/tariqi-src/tariqi-android" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=/tmp/tariqi-src" >> "$GITHUB_ENV"
          fi

      - name: Patch Mp3Quran client nullable fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/tariqi-src/tariqi-android/app/src/main/java/com/iegy/tariqi/media/Mp3QuranClient.kt")
          s = p.read_text(encoding="utf-8")
          old = '        val raw = if (refresh) runCatching { fetch(API) }.getOrNull() else null'
          new = '        val raw = (if (refresh) runCatching { fetch(API) }.getOrNull() else null)'
          if s.count(old) != 1:
              raise SystemExit(f"Expected exactly one Mp3QuranClient target line, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          nl -ba "$PROJECT_DIR/app/src/main/java/com/iegy/tariqi/media/Mp3QuranClient.kt" | sed -n '15,32p'

      - name: Upload reconstructed source diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: tariqi-reconstructed-source
          path: ${{ env.PROJECT_DIR }}
          retention-days: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download sherpa-onnx Android runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/app/libs"
          curl -L --fail --retry 4 --retry-delay 2 \
            -o "$PROJECT_DIR/app/libs/sherpa-onnx-1.13.2.aar" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-1.13.2.aar"
          echo "aa5505c0ec4f8bdaee5f214a64ba3012be64f2aecc022e82a64f33392b8dd245  $PROJECT_DIR/app/libs/sherpa-onnx-1.13.2.aar" | sha256sum -c -

      - name: Compile debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tariqi-output/build-tools/lib
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" /tmp/tariqi-output/Tariqi-base-debug.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/tariqi-output/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" /tmp/tariqi-output/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" /tmp/tariqi-output/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/tariqi-output/build-tools/lib/
          cp -r "$PROJECT_DIR" /tmp/tariqi-output/source
          sha256sum /tmp/tariqi-output/Tariqi-base-debug.apk > /tmp/tariqi-output/BASE_APK_SHA256.txt

      - name: Upload Tariqi build kit
        uses: actions/upload-artifact@v4
        with:
          name: tariqi-android-build-kit
          path: /tmp/tariqi-output
          retention-days: 14
